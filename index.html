<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khám phá những địa điểm du lịch nổi tiếng tại Việt Nam.">
    <title>Khám phá Việt Nam</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a class="skip-link" href="#main-content">Bỏ qua nội dung chính</a>

    <header class="site-header">
        <h1>KHÁM PHÁ VIỆT NAM</h1>
        <p>
            Hành trình khám phá những cảnh đẹp, văn hóa và
            trải nghiệm đáng nhớ trên dải đất hình chữ S.
        </p>
    </header>

    <main id="main-content" class="gallery">
        <figure class="gallery-item">
            <img src="images/halong.jpg"
                 alt="Các đảo đá vôi nổi bật giữa làn nước xanh tại vịnh Hạ Long">
            <figcaption>
                <h2>Vịnh Hạ Long</h2>
                <p>
                    Vịnh Hạ Long nổi tiếng với hàng nghìn đảo đá vôi
                    và cảnh quan thiên nhiên kỳ vĩ.
                </p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="images/danang.jpg"
                 alt="Cầu Vàng được nâng đỡ bởi đôi bàn tay đá khổng lồ tại Đà Nẵng">
            <figcaption>
                <h2>Đà Nẵng</h2>
                <p>
                    Đà Nẵng hấp dẫn du khách bởi những cây cầu độc đáo,
                    bãi biển đẹp và nhịp sống hiện đại.
                </p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="images/hoian.jpg"
                 alt="Những ngôi nhà vàng và đèn lồng nhiều màu tại phố cổ Hội An">
            <figcaption>
                <h2>Phố cổ Hội An</h2>
                <p>
                    Hội An lưu giữ nét kiến trúc cổ kính, những con phố
                    nhỏ và không gian văn hóa đặc sắc.
                </p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="images/trangan.jpg"
                 alt="Dòng sông uốn lượn giữa các dãy núi đá vôi ở Tràng An">
            <figcaption>
                <h2>Tràng An</h2>
                <p>
                    Tràng An gây ấn tượng với núi đá vôi, hang động
                    và dòng sông trong xanh giữa thiên nhiên.
                </p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="images/dalat.jpg"
                 alt="Khung cảnh rừng thông và hồ nước thơ mộng tại Đà Lạt">
            <figcaption>
                <h2>Đà Lạt</h2>
                <p>
                    Đà Lạt có khí hậu mát mẻ, rừng thông xanh,
                    vườn hoa và những góc phố yên bình.
                </p>
            </figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="images/nhatrang.jpg"
                 alt="Bãi biển Nha Trang với làn nước xanh và bờ cát sáng màu">
            <figcaption>
                <h2>Nha Trang</h2>
                <p>
                    Nha Trang là điểm đến lý tưởng để tắm biển,
                    khám phá các hòn đảo và trải nghiệm thể thao nước.
                </p>
            </figcaption>
        </figure>
    </main>

    <footer class="site-footer">
        <p>Khám phá Việt Nam – Mỗi hành trình là một trải nghiệm mới.</p>
    </footer>
</body>
</html>
